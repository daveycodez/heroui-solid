name: Docs Parity

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/heroui-solid/**"
      - ".github/workflows/docs-parity.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/heroui-solid/**"
      - ".github/workflows/docs-parity.yml"
  schedule:
    # Daily upstream drift check against heroui-inc/heroui@v3.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The vitest globalSetup fetches parity fixtures at the sha pinned in
      # apps/docs/parity/upstream.lock.json; the token raises the GitHub API
      # rate limit for that fetch.
      - run: bun nx test docs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # sync.ts has no dependencies beyond bun itself — no install needed.
      - name: Check upstream for drift
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun apps/docs/parity/sync.ts --check > drift-report.md
          code=$?
          set -e
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            cat drift-report.md
            exit "$code"
          fi
      - name: File or update the drift issue
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create docs-parity \
            --description "Upstream HeroUI docs moved under the parity pin" \
            --color BFD4F2 --force
          existing=$(gh issue list --label docs-parity --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file drift-report.md
            echo "updated issue #$existing"
          else
            gh issue create \
              --title "Upstream HeroUI docs drift (heroui-inc/heroui@v3)" \
              --label docs-parity \
              --body-file drift-report.md
          fi
