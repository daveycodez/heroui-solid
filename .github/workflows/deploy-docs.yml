name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Project Pages serve under /<repo>/ — DOCS_BASE_PATH threads that
      # through vite/router/nitro (see apps/docs/vite.config.ts). Drop the
      # env var if the site ever moves to a custom domain.
      - run: bun nx build docs
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/
      # Prerender failures fail the build (nitro failOnError), but a route
      # that silently never prerendered wouldn't — smoke-check the outputs
      # that have no crawlable link pointing at them.
      - name: Smoke-check build output
        run: |
          test -f apps/docs/.output/public/index.html
          test -f apps/docs/.output/public/api/search
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
